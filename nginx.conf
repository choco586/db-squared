# /etc/nginx/sites-available/db-squared
#
# Copy this file to EC2:
#   scp nginx.conf ec2-user@<ec2-ip>:/tmp/db-squared.conf
#   sudo mv /tmp/db-squared.conf /etc/nginx/sites-available/db-squared
#   sudo ln -s /etc/nginx/sites-available/db-squared /etc/nginx/sites-enabled/db-squared
#   sudo nginx -t        ← test config
#   sudo systemctl reload nginx
#
# Frontend files must be at: /var/www/db-squared/
# Flask must be running at:  localhost:5000

server {
    listen 80;
    server_name _;    # accepts any hostname — replace with your EC2 public IP or domain

    # ── Static frontend files ──────────────────────────────
    root  /var/www/db-squared;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Flask API proxy ────────────────────────────────────
    # All requests to /api are forwarded to Flask on localhost:5000
    location /api {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass our custom auth headers through unchanged
        proxy_pass_request_headers on;
    }

    # ── Basic security headers ─────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection       "1; mode=block";
}